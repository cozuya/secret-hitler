# Render Blueprint for secret-hitler (secrethitler.io).
#
# Single web service, ONE instance: all live game state is held in memory (the `games` object,
# user lists, chats) and there is no socket.io Redis adapter, so running >1 instance would split
# games across processes and break them. Do not enable autoscaling.
#
# Redis/Valkey is intentionally NOT declared here. This app reuses an existing Render Key Value
# instance from another service (same Virginia region), reached over its internal URL. The app
# isolates itself to db 10 (sessions, app.js) and db 11 (global settings, routes/socket/models.js);
# db 0-9 belong to the other app. REDIS_URL is therefore a dashboard secret, not a `fromService` link.
#
# MongoDB is on Atlas (Render has no managed Mongo); MONGO_URL is a dashboard secret too.
#
# Every `sync: false` value is entered in the Render dashboard and never stored in the repo.
# Copy the values from the current production .env.

services:
  - type: web
    name: secret-hitler
    runtime: node
    region: virginia # must match the existing Redis's region so the internal URL resolves
    plan: starter # 512MB / 0.5 CPU; bump to `standard` if the memory metric runs hot
    numInstances: 1 # never scale >1 (in-memory game state)
    healthCheckPath: /
    autoDeploy: false # a redeploy restarts the process and drops every live game — deploy off-peak, deliberately
    # --prod=false forces devDependencies (vite, sass, etc.) to install even though NODE_ENV=production,
    # otherwise the build tooling is missing. The committed build output is git-ignored, so Render must build it.
    buildCommand: pnpm install --prod=false && pnpm run build-css:web && pnpm run build-css:dark && pnpm build
    # bin/dev.js is the only server entry (despite the name). It pulls in node-notifier, which is a
    # devDependency — so the deploy must keep devDependencies installed (don't add a prune step).
    startCommand: node bin/dev.js
    # Two things must survive deploys/restarts (the service filesystem is ephemeral): user-uploaded
    # custom cardbacks (rainbow users) and the OOM/crash diagnostics. ONE Persistent Disk holds both.
    # LAYOUT (matches the live mount — verified with findmnt): the disk is mounted at
    # /var/data/cardbacks. Its PARENT /var/data is a root-owned ephemeral dir the runtime user (uid
    # 1000) can NOT write to — so a sibling like /var/data/diagnostics is both unwritable (EACCES) and
    # non-persistent; that's why the earlier sibling layout silently logged nothing. Diagnostics
    # therefore live INSIDE the mount as a dot-dir: DIAGNOSTICS_DIR=/var/data/cardbacks/.diagnostics.
    # app.js static-serves CARDBACK_DIR at /images/custom-cardbacks with dotfiles:"deny", so the
    # .diagnostics dir (crash logs / heap snapshots — can hold session data) is NOT publicly
    # downloadable even though it sits under the served tree. The built public/ tree isn't writable by
    # the runtime user (overwrites -> EACCES), which is why cardbacks can't live there either. A disk
    # pins the service to ONE instance with non-zero-downtime deploys — already true here (in-memory
    # game state, numInstances: 1), so nothing is lost. Size is generous: cardbacks are 70x95 PNGs (a
    # few KB each) and diagnostics ~200KB/day of JSONL plus the occasional heap snapshot; 1GB holds both.
    disk:
      name: cardbacks
      mountPath: /var/data/cardbacks
      sizeGB: 1
    envVars:
      # --- non-secret config (safe to commit) ---
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        # Keep the existing production old-space ceiling while the sampler establishes the live
        # heap floor under load. This is only a ceiling, not a reservation or a guarantee that the
        # process fits inside the 512MB instance once native memory is included.
        value: --max-old-space-size=400
      - key: MALLOC_ARENA_MAX
        # Cap glibc's per-thread malloc arenas. Production RSS has grown far beyond V8 heap +
        # external memory under load; limiting arenas is a low-risk way to test/reduce allocator
        # fragmentation without changing application behavior.
        value: "2"
      - key: CARDBACK_DIR # the disk mount root (static-served at /images/custom-cardbacks)
        value: /var/data/cardbacks
      # A DOT-dir INSIDE the disk mount (NOT a sibling — /var/data isn't writable by the runtime user;
      # see the disk note above). dotfiles:"deny" on the static serve keeps it private. bin/diagnostics.js
      # falls back to this exact path if this var is unset/unwritable; set it explicitly for visibility.
      - key: DIAGNOSTICS_DIR
        value: /var/data/cardbacks/.diagnostics
      - key: NODE_VERSION
        value: "24.12.0" # .node-version holds a range; pin an exact version for Render's builder
      - key: HUSKY
        value: "0" # no-op husky's git-hook install during `pnpm install` on the builder
      # --- secrets: set these in the dashboard (sync: false = value lives in Render, not the repo) ---
      - key: MONGO_URL # Atlas SRV string, including /secret-hitler-app in the path
        sync: false
      - key: REDIS_URL # existing Render Key Value INTERNAL url (redis://red-...:6379)
        sync: false
      - key: SECRETSESSIONKEY # strong random value; otherwise the code falls back to "hunter2"
        sync: false
      - key: DISCORDCLIENTID
        sync: false
      - key: DISCORDCLIENTSECRET
        sync: false
      - key: GITHUBCLIENTID
        sync: false
      - key: GITHUBCLIENTSECRET
        sync: false
      - key: MGKEY # Mailgun API key (account-verification email)
        sync: false
      - key: MGDOMAIN # Mailgun domain
        sync: false
      - key: DISCORDREPORTURL
        sync: false
      - key: DISCORDURL
        sync: false
      - key: DISCORDMODID
        sync: false
      - key: DISCORDFEEDBACKURL
        sync: false
      - key: DISCORDBROADCASTURL
        sync: false
      - key: DISCORDMODDMSTHREADURL
        sync: false
      - key: DISCORDMODLOGURL
        sync: false
      - key: DISCORDADMINPING
        sync: false
      - key: DISCORDCRASHURL
        sync: false
      - key: DISCORDPRIVATEDEVELOPERS
        sync: false
      - key: GETIPINTELAPIEMAIL
        sync: false

  # Daily leaderboard generation. A SEPARATE Cron service (not the web app) for two reasons:
  # (1) a Render Persistent Disk attaches to one service, so a cron can't share the web's cardbacks
  # disk; (2) the web instance is memory-tight, so the heavy account scan must not run in-process.
  # It writes the result to Mongo (a single `leaderboards` doc); the web serves it at
  # GET /leaderboardData.json. No disk needed here (output goes to Mongo, not a file).
  - type: cron
    name: secret-hitler-leaderboard
    runtime: node
    region: virginia # same region as Atlas/Redis for low-latency access
    plan: starter
    schedule: "0 9 * * *" # daily at 09:00 UTC (off-peak); adjust as desired
    buildCommand: pnpm install --prod=false
    startCommand: node scripts/retrieveLeaderboardData.js
    envVars:
      - key: MONGO_URL # same Atlas SRV string as the web service (set in the dashboard)
        sync: false
      - key: NODE_VERSION
        value: "24.12.0"
      - key: HUSKY
        value: "0" # no-op husky's git-hook install during `pnpm install` on the builder

  # Daily win-rate stats generation for the /stats and /stats-season pages. A SEPARATE Cron service
  # for the same reasons as the leaderboard cron above: the full `games` collection scan is too heavy
  # to run in-process on the memory-tight web instance, and it needs no Persistent Disk (output goes to
  # Mongo — a single `gamestats` doc — which the web serves at GET /statsData.json). Replaces the old
  # VPS cron that wrote a data.json file nginx served directly.
  - type: cron
    name: secret-hitler-stats
    runtime: node
    region: virginia # same region as Atlas for low-latency access
    plan: starter
    schedule: "30 9 * * *" # daily at 09:30 UTC — offset from the leaderboard cron so they don't scan Atlas at once
    buildCommand: pnpm install --prod=false
    startCommand: node scripts/retrieveGameData.js
    envVars:
      - key: MONGO_URL # same Atlas SRV string as the web service (set in the dashboard)
        sync: false
      - key: NODE_VERSION
        value: "24.12.0"
      - key: HUSKY
        value: "0" # no-op husky's git-hook install during `pnpm install` on the builder
